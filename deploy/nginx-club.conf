server {
    listen 80;
    listen [::]:80;
    server_name cqaiclub.asia www.cqaiclub.asia;
    return 301 https://cqaiclub.asia$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cqaiclub.asia www.cqaiclub.asia;

    ssl_certificate /etc/nginx/ssl/cqaiclub.asia.pem;
    ssl_certificate_key /etc/nginx/ssl/cqaiclub.asia.key;

    # Leave room for multipart framing while the application enforces the
    # exact 5 MiB project-cover limit and validates the image signature.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Six recap images may total 30 MiB. Keep the larger limit on this route only.
    location ~ ^/api/v1/activities/[^/]+/recap/?$ {
        client_max_body_size 31m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 127.0.0.1:8080;
    client_max_body_size 6m;
    location ~ ^/api/v1/activities/[^/]+/recap/?$ {
        client_max_body_size 31m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
